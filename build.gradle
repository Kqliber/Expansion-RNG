plugins {
    id 'org.jetbrains.kotlin.jvm' version '1.6.0'
    id 'com.github.johnrengelman.shadow' version '7.0.0'
}

group 'me.kaliber'
version '1.0.0'

repositories {
    mavenCentral()
    maven {
        url 'https://repo.extendedclip.com/content/repositories/placeholderapi'
    }
    maven {
        url 'https://maven.hytale.com/release/'
    }
}

dependencies {
    implementation ('org.jetbrains.kotlin:kotlin-stdlib:1.6.0') {
        exclude group: 'org.jetbrains'
    }

    compileOnly 'com.hypixel.hytale:Server:2026.01.24-6e2d4fc36'
    compileOnly 'at.helpch:placeholderapi-hytale:1.0.1'
}

shadowJar {
    archiveFileName = 'Expansion-RNG.jar'
    relocate 'kotlin', 'me.kaliber.expansions.rng.libs.kotlin'
    exclude 'META-INF/versions/9/module-info.class' // papi classloading bad - java 8 support
    minimize()
}
